services:
  postgres:
    image: postgres:16
    container_name: chapter-lane-postgres
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    ports:
      - "5432:5432"
    volumes:
      - chapter-lane-postgres:/var/lib/postgresql/data

volumes:
  chapter-lane-postgres:
